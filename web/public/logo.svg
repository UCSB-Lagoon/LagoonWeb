  </defs>

  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#shine)"/>

  <!-- Wave layers — deeper, more graphic -->
  <g clip-path="url(#clip)">
    <path d="M0 790 C160 750 280 830 420 795 C560 760 680 830 840 798 C920 782 980 800 1024 786 L1024 1024 L0 1024 Z"
          fill="#fff" opacity="0.07"/>
    <path d="M0 840 C120 810 260 860 400 835 C540 810 660 860 820 838 C920 824 980 840 1024 828 L1024 1024 L0 1024 Z"
          fill="#fff" opacity="0.07"/>
    <path d="M0 892 C180 868 320 905 500 885 C680 865 820 906 1024 880 L1024 1024 L0 1024 Z"
          fill="#fff" opacity="0.09"/>
  </g>

  <!-- L — slightly wider foot for better proportion -->
  <rect x="298" y="232" width="112" height="510" rx="20" fill="#fff"/>
  <rect x="298" y="670" width="400" height="112" rx="20" fill="#fff"/>
</svg>
