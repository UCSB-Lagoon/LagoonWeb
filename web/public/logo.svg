<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#cc6133"/>
      <stop offset="100%" stop-color="#a83d18"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#e8784a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a83d18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="1024" height="1024" rx="230" ry="230"/>
